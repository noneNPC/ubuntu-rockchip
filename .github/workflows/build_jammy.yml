name: Build Jammy

on:
  workflow_dispatch:

  workflow_call:
    outputs:
      run_id:
        description: "Build Jammy workflow run ID"
        value: ${{ jobs.build.outputs.run_id }}

run-name: Build Jammy

jobs:
  rootfs:
    runs-on: ubuntu-22.04
    name: Build rootfs (jammy)

    strategy:
      matrix:
        flavor:
          - desktop
          - server

    steps:
      - name: Get more disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout LFS
        shell: bash
        run: git lfs fetch && git lfs checkout

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get purge needrestart -y
          sudo apt-get upgrade -y
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            bison \
            qemu-user-static \
            qemu-system-arm \
            qemu-efi \
            u-boot-tools \
            binfmt-support \
            debootstrap \
            flex \
            libssl-dev \
            bc \
            rsync \
            kmod \
            cpio \
            xz-utils \
            fakeroot \
            parted \
            udev \
            dosfstools \
            uuid-runtime \
            git-lfs \
            device-tree-compiler \
            python2 \
            python3 \
            python-is-python3 \
            fdisk \
            debhelper \
            python3-pyelftools \
            python3-setuptools \
            python3-distutils \
            python3-pkg-resources \
            swig \
            libfdt-dev \
            libpython3-dev \
            dctrl-tools

      - name: Build
        shell: bash
        run: |
          sudo ./build.sh \
            --suite=jammy \
            --flavor=${{ matrix.flavor }} \
            --rootfs-only

      - name: Upload
        uses: actions/upload-artifact@v4.3.3
        with:
          name: ubuntu-22.04-preinstalled-${{ matrix.flavor }}-arm64-rootfs
          path: ./build/ubuntu-22.04-preinstalled-${{ matrix.flavor }}-arm64.rootfs.tar.xz
          if-no-files-found: error


  kernel:
    runs-on: ubuntu-22.04
    name: Build kernel (jammy)

    steps:
      - name: Get more disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout LFS
        shell: bash
        run: git lfs fetch && git lfs checkout

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get purge needrestart -y
          sudo apt-get upgrade -y
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            bison \
            qemu-user-static \
            qemu-system-arm \
            qemu-efi \
            u-boot-tools \
            binfmt-support \
            debootstrap \
            flex \
            libssl-dev \
            bc \
            rsync \
            kmod \
            cpio \
            xz-utils \
            fakeroot \
            parted \
            udev \
            dosfstools \
            uuid-runtime \
            git-lfs \
            device-tree-compiler \
            python2 \
            python3 \
            python-is-python3 \
            fdisk \
            debhelper \
            python3-pyelftools \
            python3-setuptools \
            python3-distutils \
            python3-pkg-resources \
            swig \
            libfdt-dev \
            libpython3-dev

      - name: Build
        shell: bash
        run: |
          sudo ./build.sh \
            --suite=jammy \
            --kernel-only

      - name: Upload
        uses: actions/upload-artifact@v4.3.3
        with:
          name: linux-rockchip-5.10
          path: ./build/linux-*.deb
          if-no-files-found: error


  build:
    runs-on: ubuntu-22.04
    needs:
      - rootfs
      - kernel

    name: Build image (jammy)

    outputs:
      run_id: ${{ steps.run_id.outputs.run_id }}

    strategy:
      matrix:
        board:
          - youyeetoo-r1
        flavor:
          - desktop
          - server

    steps:
      - name: Set workflow run ID
        id: run_id
        shell: bash
        run: |
          echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Get more disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout LFS
        shell: bash
        run: git lfs fetch && git lfs checkout

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get purge needrestart -y
          sudo apt-get upgrade -y
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            bison \
            qemu-user-static \
            qemu-system-arm \
            qemu-efi \
            u-boot-tools \
            binfmt-support \
            debootstrap \
            flex \
            libssl-dev \
            bc \
            rsync \
            kmod \
            cpio \
            xz-utils \
            fakeroot \
            parted \
            udev \
            dosfstools \
            uuid-runtime \
            git-lfs \
            device-tree-compiler \
            python2 \
            python3 \
            python-is-python3 \
            fdisk \
            debhelper \
            python3-pyelftools \
            python3-setuptools \
            python3-distutils \
            python3-pkg-resources \
            swig \
            libfdt-dev \
            libpython3-dev \
            dctrl-tools

      - name: Checkout rootfs
        uses: actions/download-artifact@v4.1.2
        with:
          name: ubuntu-22.04-preinstalled-${{ matrix.flavor }}-arm64-rootfs
          path: ./build/

      - name: Checkout kernel
        uses: actions/download-artifact@v4.1.2
        with:
          name: linux-rockchip-5.10
          path: ./build/

      - name: Build
        shell: bash
        run: |
          sudo ./build.sh \
            --board=${{ matrix.board }} \
            --suite=jammy \
            --flavor=${{ matrix.flavor }}

      - name: Upload
        uses: actions/upload-artifact@v4.3.3
        with:
          name: ubuntu-22.04-preinstalled-${{ matrix.flavor }}-arm64-${{ matrix.board }}
          path: ./images/ubuntu-*-preinstalled-${{ matrix.flavor }}-arm64-${{ matrix.board }}.*
          if-no-files-found: error

      - name: Clean cache
        shell: bash
        run: |
          sync
          sudo rm -rf ./images/ ./build/
          sync