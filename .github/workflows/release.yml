name: Release Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "v0.1.0"

      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read


jobs:

  # ============================================================
  # Build Ubuntu 22.04
  # ============================================================
  jammy:
    name: Build Jammy
    uses: ./.github/workflows/build_jammy.yml


  # ============================================================
  # Build Ubuntu 24.04
  # ============================================================
  noble:
    name: Build Noble
    uses: ./.github/workflows/build_noble.yml


  # ============================================================
  # Release
  # ============================================================
  release:
    name: Create GitHub Release

    needs:
      - jammy
      - noble

    runs-on: ubuntu-22.04

    steps:

      - name: Download Ubuntu 22.04 Desktop
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-22.04-preinstalled-desktop-arm64-youyeetoo-r1
          path: release/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.jammy.outputs.run_id }}


      - name: Download Ubuntu 22.04 Server
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-22.04-preinstalled-server-arm64-youyeetoo-r1
          path: release/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.jammy.outputs.run_id }}


      - name: Download Ubuntu 24.04 Desktop
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-24.04-preinstalled-desktop-arm64-youyeetoo-r1
          path: release/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.noble.outputs.run_id }}


      - name: Download Ubuntu 24.04 Server
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-24.04-preinstalled-server-arm64-youyeetoo-r1
          path: release/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.noble.outputs.run_id }}


      - name: List files
        shell: bash
        run: |
          echo "Release files:"
          ls -lh release/


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Ubuntu Rockchip ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}

          files: |
            release/*.img.xz
            release/*.sha256

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}